apiVersion: v1
kind: Namespace
metadata:
  name: titconn-rag-mcp-server

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-mcp-server
  namespace: titconn-rag-mcp-server
  labels:
    app: rag-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-mcp-server
  template:
    metadata:
      labels:
        app: rag-mcp-server
    spec:
      imagePullSecrets:
      - name: harborsecret
      containers:
      - name: rag-mcp
        image: images.teknobulut.net/titconn/rag-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http-sse
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: postgres-rag-secret
              key: POSTGRES_URL
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /sse
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /sse
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: rag-mcp-service
  namespace: titconn-rag-mcp-server
spec:
  type: ClusterIP
  selector:
    app: rag-mcp-server
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http

---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: rag-mcp-ingress
  namespace: titconn-rag-mcp-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns01
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/ssl-passthrough: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rag-mcp.teknobulut.net
      secretName: rag-mcp-teknobulut-net-tls
  rules:
    - host: rag-mcp.teknobulut.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-mcp-service
                port:
                  number: 80